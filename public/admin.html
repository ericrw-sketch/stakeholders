<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CityWatt — Suivi des contacts</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { display: block; }
    .wrap { padding: 16px; max-width: 1400px; margin: 0 auto; }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .toolbar h1 { margin: 0; font-size: 20px; flex: 1; }
    .toolbar a.btn { text-decoration: none; }
    .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: var(--bg); font-weight: 600; white-space: nowrap; }
    td small { color: var(--muted); display: block; }
    td select, td textarea { min-width: 150px; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
    .stat b { display: block; font-size: 22px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">CityWatt <span>Suivi équipe</span></div>
    <div class="user"><a href="/">← Carte</a></div>
  </header>
  <div class="wrap">
    <div class="toolbar">
      <h1>Contacts proposés</h1>
      <a class="btn primary" style="width:auto" href="/api/admin/export.xlsx">Exporter en Excel</a>
    </div>
    <div class="stats" id="stats"></div>
    <p class="error" id="error"></p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Immeuble</th><th>Proposé par</th><th>Contact</th><th>Chemin</th>
            <th>Lien</th><th>Quand / remarques</th><th>Suivi</th><th>Notes équipe</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    async function patch(id, body) {
      const res = await fetch(`/api/admin/contributions/${id}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      if (!res.ok) document.getElementById('error').textContent = (await res.json()).error;
    }

    async function load() {
      const res = await fetch('/api/admin/contributions');
      if (res.status === 401 || res.status === 403) { location.href = '/'; return; }
      const { contributions, followUpOptions } = await res.json();
      contributions.sort((a, b) => b.createdAt.localeCompare(a.createdAt));

      const leads = new Set(contributions.map((c) => c.leadId));
      const people = new Set(contributions.map((c) => c.author.name));
      const intros = contributions.filter((c) => c.mode === 'intro').length;
      document.getElementById('stats').innerHTML = [
        [contributions.length, 'contacts proposés'],
        [leads.size, 'immeubles couverts'],
        [people.size, 'ambassadeurs actifs'],
        [intros, 'introductions proposées'],
      ].map(([n, l]) => `<div class="stat"><b>${n}</b>${l}</div>`).join('');

      document.getElementById('rows').innerHTML = contributions.map((c) => `
        <tr>
          <td>${esc(c.createdAt.slice(0, 10))}</td>
          <td><a href="/#${esc(c.leadId)}">${esc(c.leadName)}</a></td>
          <td>${esc(c.author.name)}<small>${esc(c.author.email)} · ${c.author.role === 'shareholder' ? 'actionnaire' : c.author.role === 'ambassador' ? 'ambassadeur' : 'équipe'}</small></td>
          <td><strong>${esc(c.contactName)}</strong>
            <small>${esc([c.contactFunction, c.contactCompany].filter(Boolean).join(' · '))}</small>
            <small>${esc([c.contactEmail, c.contactPhone].filter(Boolean).join(' · '))}</small></td>
          <td>${c.mode === 'intro' ? 'Introduction' : 'Contact transmis'}${c.mode === 'contact' ? `<small>${c.mentionName ? 'Peut être cité' : 'Ne pas citer'}</small>` : ''}</td>
          <td>${esc(c.strength)}<small>${esc(c.relation)}</small></td>
          <td>${esc(c.when)}<small>${esc(c.remarks)}</small></td>
          <td><select data-id="${esc(c.id)}" data-field="followUp">
            ${followUpOptions.map((o) => `<option${o === c.followUp ? ' selected' : ''}>${esc(o)}</option>`).join('')}
          </select></td>
          <td><textarea rows="2" data-id="${esc(c.id)}" data-field="teamNotes">${esc(c.teamNotes)}</textarea></td>
        </tr>`).join('') || '<tr><td colspan="9" class="muted">Aucun contact pour l’instant.</td></tr>';

      document.querySelectorAll('[data-field]').forEach((el) =>
        el.addEventListener('change', () => patch(el.dataset.id, { [el.dataset.field]: el.value })));
    }
    load();
  </script>
</body>
</html>
