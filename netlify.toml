# Site statique : la seule étape de build écrit site/config.js à partir des variables
# d'environnement Netlify (clé Google Maps notamment). Netlify publie ensuite le dossier site/.
[build]
  publish = "site"
  command = "node scripts/write-config.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # frame-ancestors : autorise l'affichage dans un onglet (iframe) de votre app. Ajoutez son domaine ici.
    Content-Security-Policy = "frame-ancestors 'self' https://*.netlify.app"
